<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="Css/all.min.css" />
    <link rel="stylesheet" href="Css/normalize.min.css" />
    <link rel="stylesheet" href="Css/bootstrap.min.css" />
    <link rel="stylesheet" href="Css/Style.css" />
    <title>Js Training 1</title>
  </head>
  <body class="bg-light">
    <button
      id="toggle-mode"
      class="btn btn-dark position-absolute top-0 start-0 mt-3 ms-3 rounded-circle"
    >
      <i class="fa-solid fa-moon"></i>
    </button>
    <div class="container counting text-center">
      <h1 class="d-block text-secondary mb-3">حساب زكاة المال</h1>
      <div class="input-group mt-4 w-50 mx-auto nofm">
        <input
          type="text"
          class="form-control nof"
          placeholder="المبلغ"
          id="money"
          aria-label="Recipient's username"
          aria-describedby="button-addon2"
        />
        <button
          class="btn btn-outline-secondary btnhoverd"
          type="button"
          id="button-addon2"
        >
          احسب
        </button>
      </div>
      <div class="result mt-4 w-50 mx-auto">
        <h2 class="d-block text-info">الزكاة المستحقة</h2>
        <p class="d-block text-success" id="result"></p>
      </div>
    </div>
    <script src="Js/bootstrap.bundle.min.js"></script>
    <script src="Js/Logic.js"></script>
  </body>
</html>
